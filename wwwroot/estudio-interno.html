<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Franki Tattoo — Gestión Privada</title>
    <link rel="icon" type="image/jpeg" href="images/franki-logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3" />
    <link rel="stylesheet" href="css/admin.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Pantalla de Bloqueo de Seguridad (Gate) -->
  <div id="auth-gate" class="auth-gate-wrapper">
    <div class="auth-gate-card">
      <div class="auth-gate-icon">🔒</div>
      <h2>Acceso Privado</h2>
      <p>Franki Tattoo Studio — Uso exclusivo para el personal autorizado.</p>
      
      <div id="gate-error-banner" class="gate-error hidden"></div>

      <form id="gate-login-form">
        <div class="gate-form-group">
          <label for="gate-email">Correo Electrónico</label>
          <input type="email" id="gate-email" placeholder="Franki@frankitattoo.com" required autocomplete="username" />
        </div>
        <div class="gate-form-group">
          <label for="gate-password">Contraseña</label>
          <input type="password" id="gate-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div class="gate-form-group hidden" id="gate-2fa-group">
          <label for="gate-2fa-code">Código 2FA (Autenticador)</label>
          <input type="text" id="gate-2fa-code" placeholder="123456" autocomplete="one-time-code" />
        </div>
        <button type="submit" id="gate-submit-btn" class="gate-btn">Desbloquear Panel ➔</button>
      </form>

      <div class="gate-footer">
        <a href="index.html">← Volver al sitio público</a>
      </div>
    </div>
  </div>

  <!-- Panel Completo (Oculto hasta autenticarse como Admin o Employee) -->
  <div id="dashboard-view" class="hidden">
    <header>
      <h1>🖋️ Franki Tattoo — Panel de Gestión</h1>
      <div id="auth-box"></div>
    </header>

    <div id="error-banner" class="hidden"></div>

    <nav id="tabs"></nav>

    <main id="content"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
